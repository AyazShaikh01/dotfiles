# ============================================================
# Ubuntu Keyboard Layer
# ============================================================
#
# This file is the source of truth for the keyboard layer.
#
# Syntax:
#
#   KEYBINDING = ACTION
#
# ============================================================


# ------------------------------------------------------------
# Applications
# ------------------------------------------------------------

SUPER+ENTER = terminal
SUPER+E     = files
SUPER+B     = browser

# ------------------------------------------------------------
# Workspaces
# ------------------------------------------------------------

SUPER+1 = workspace:1
SUPER+2 = workspace:2
SUPER+3 = workspace:3
SUPER+4 = workspace:4
SUPER+5 = workspace:5
SUPER+6 = workspace:6
SUPER+7 = workspace:7
SUPER+8 = workspace:8
SUPER+9 = workspace:9
SUPER+0 = workspace:last


# ------------------------------------------------------------
# Move current window to workspace
# ------------------------------------------------------------

SUPER+SHIFT+1 = move-to-workspace:1
SUPER+SHIFT+2 = move-to-workspace:2
SUPER+SHIFT+3 = move-to-workspace:3
SUPER+SHIFT+4 = move-to-workspace:4
SUPER+SHIFT+5 = move-to-workspace:5
SUPER+SHIFT+6 = move-to-workspace:6
SUPER+SHIFT+7 = move-to-workspace:7
SUPER+SHIFT+8 = move-to-workspace:8
SUPER+SHIFT+9 = move-to-workspace:9
SUPER+SHIFT+0 = move-to-workspace:last


# ------------------------------------------------------------
# Windows
# ------------------------------------------------------------

SUPER+W = close
SUPER+F = toggle-maximized


# ------------------------------------------------------------
# System
# ------------------------------------------------------------

SUPER+L = lock
